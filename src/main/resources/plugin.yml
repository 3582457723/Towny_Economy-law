name: TownyEconomyLaw
version: 1.1.0
main: dev.townyeconomylaw.TownyEconomyLaw
api-version: '1.21.11'
depend: [Towny, Vault]
softdepend: [QuickShop, QuickShop-Hikari]
commands:
  tel:
    aliases: [townyeconomylaw]
    description: 経済・司法メニュー
    usage: /tel
    permission: townyeconomylaw.use
  company:
    description: 企業・ロット・鉄道の運営
    usage: /company help
    permission: townyeconomylaw.use
  corporation:
    description: 法人・ロット・鉄道の運営
    usage: /corporation help
    permission: townyeconomylaw.use
  election:
    description: 所属国の選挙・投票 GUI
    usage: /election GUI
    permission: townyeconomylaw.use
  approval_rating:
    description: 所属国の政権への支持・不支持 GUI
    usage: /approval_rating GUI
    permission: townyeconomylaw.use
  request:
    description: パスポート・ビザを申請
    usage: /request <passport|visa|status>
    permission: townyeconomylaw.use
  shopaverage:
    aliases: [shopavg]
    description: 現ワールドのショップ平均価格をカテゴリ別に閲覧
    usage: /shopaverage [hand]
    permission: townyeconomylaw.use
permissions:
  townyeconomylaw.use:
    default: true
  townyeconomylaw.jail.override:
    description: 管理者による緊急釈放
    default: op
  townyeconomylaw.lockdown.bypass:
    description: ロックダウン中の越境許可
    default: op
  townyeconomylaw.illness.manage:
    description: ゲーム内の病気を管理
    default: op
